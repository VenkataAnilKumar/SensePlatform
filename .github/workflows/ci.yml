name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [mind, gate, wire]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml
      - name: System packages (audio/video)
        if: matrix.service == 'mind'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: Install
        run: pip install "./services/${{ matrix.service }}[dev]"
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: pytest -q tests

  console:
    name: console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: services/console
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: services/console
        run: npm run build

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cp .env.example .env
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for svc in "3000 gate" "3001 wire" "8080 mind"; do
            set -- $svc
            for i in $(seq 1 60); do
              curl -fsS "http://localhost:$1/health" >/dev/null && break
              [ "$i" = 60 ] && { echo "$2 did not become healthy"; exit 1; }
              sleep 5
            done
          done
      - name: API smoke test
        run: |
          set -e
          KEY=$(curl -fsS -X POST localhost:3000/tenants -H 'content-type: application/json' \
            -d '{"name":"CI","slug":"ci","email":"ci@example.com"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["api_key"])')
          curl -fsS localhost:3000/tenants/me -H "X-API-Key: $KEY" >/dev/null
          curl -fsS -X POST localhost:3000/auth/token -H "X-API-Key: $KEY" \
            -H 'content-type: application/json' -d '{"user_id":"ci-user"}' >/dev/null
          curl -fsS -X POST localhost:3000/rooms/ci/join -H "X-API-Key: $KEY" \
            -H 'content-type: application/json' -d '{"user_id":"ci-user"}' >/dev/null
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
