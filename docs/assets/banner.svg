<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Sense Platform</title>
  <desc id="d">Self-hosted platform for AI video, voice and vision apps</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glow)"/>

  <!-- lens mark -->
  <g transform="translate(96 78)">
    <circle cx="44" cy="44" r="44" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="44" cy="44" r="26" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.7"/>
    <circle cx="44" cy="44" r="10" fill="url(#accent)"/>
  </g>

  <text x="210" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Sense Platform</text>
  <text x="212" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#C7D2FE">Self-hosted infrastructure for AI video, voice and vision apps</text>
  <text x="212" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#94A3B8">Real-time rooms · AI agents that see and hear · chat · dashboard — on servers you own</text>

  <!-- service chips -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E0E7FF">
    <g transform="translate(96 262)"><rect width="150" height="40" rx="20" fill="#312E81" stroke="#4F46E5"/><text x="75" y="26" text-anchor="middle">Relay · WebRTC</text></g>
    <g transform="translate(262 262)"><rect width="150" height="40" rx="20" fill="#312E81" stroke="#4F46E5"/><text x="75" y="26" text-anchor="middle">Mind · Agents</text></g>
    <g transform="translate(428 262)"><rect width="150" height="40" rx="20" fill="#312E81" stroke="#4F46E5"/><text x="75" y="26" text-anchor="middle">Gate · API</text></g>
    <g transform="translate(594 262)"><rect width="150" height="40" rx="20" fill="#312E81" stroke="#4F46E5"/><text x="75" y="26" text-anchor="middle">Wire · Chat</text></g>
    <g transform="translate(760 262)"><rect width="210" height="40" rx="20" fill="#312E81" stroke="#4F46E5"/><text x="105" y="26" text-anchor="middle">Console · Dashboard</text></g>
  </g>
</svg>
